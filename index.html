<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light Gun Arcade - Gesture Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0d0f12;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      background: #15181f;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #webcam {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 180px;
      height: 101px;
      object-fit: cover;
      border: 2px solid #2a313d;
      border-radius: 6px;
      transform: scaleX(-1);
      z-index: 2;
      opacity: 0.85;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-stats {
      background: rgba(18, 22, 29, 0.75);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }
    .hud-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7d8b99;
    }
    .hud-value {
      font-size: 28px;
      font-weight: 800;
      color: #00ffcc;
      font-family: monospace;
    }
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .status-pill {
      background: rgba(18, 22, 29, 0.8);
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid #333d4b;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #e1e7ec;
    }
    .ammo-box {
      background: rgba(18, 22, 29, 0.75);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .bullet-icon {
      width: 10px;
      height: 24px;
      background: #f1c40f;
      border-radius: 4px 4px 1px 1px;
      box-shadow: 0 0 6px rgba(241, 196, 15, 0.5);
      transition: opacity 0.15s ease;
    }
    .bullet-icon.spent {
      background: #2a313d;
      box-shadow: none;
      opacity: 0.3;
    }
    #start-modal {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 16, 0.95);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 24px;
    }
    #start-btn {
      background: #00ffcc;
      color: #0a0c10;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    #start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4);
    }
    .instructions {
      max-width: 480px;
      font-size: 14px;
      color: #8c9ba5;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <video id="webcam" autoplay playsinline muted></video>

    <div id="ui-overlay">
      <div class="hud-top">
        <div class="hud-stats">
          <div class="hud-title">Score</div>
          <div class="hud-value" id="score-el">0</div>
        </div>
        <div class="hud-stats">
          <div class="hud-title">Accuracy</div>
          <div class="hud-value" id="accuracy-el">100%</div>
        </div>
      </div>

      <div class="hud-bottom">
        <div class="status-pill" id="status-pill">INITIALIZING SYSTEM</div>
        <div class="ammo-box" id="ammo-cylinder"></div>
      </div>
    </div>

    <div id="start-modal">
      <h1 style="font-size: 38px; letter-spacing: 2px;">GESTURE SHOOTER</h1>
      <p class="instructions">
        Make a <strong>gun shape</strong> with your hand (index finger extended, thumb up).<br />
        Aim with your fingertip. <strong>Flick your thumb down</strong> to fire.<br />
        Lower hand off-screen or press <strong>R</strong> to reload.
      </p>
      <button id="start-btn">CALIBRATE & START</button>
    </div>
  </div>

  <!-- MediaPipe Tasks Vision via ESM -->
  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    // --- Audio Synthesis Engine ---
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }
      playShot() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // White noise burst
        const bufferSize = this.ctx.sampleRate * 0.25;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.2);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        // Low punch oscillator
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        oscGain.gain.setValueAtTime(0.8, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      playShatter() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.35;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.setValueAtTime(3200, now);
        filter.frequency.exponentialRampToValueAtTime(800, now + 0.35);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playEmptyClick() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(300, now + 0.02);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      }
      playReload() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        for (let i = 0; i < 2; i++) {
          const t = now + i * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(400 + i * 200, t);
          osc.frequency.exponentialRampToValueAtTime(150, t + 0.05);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.06);
        }
      }
    }

    // --- State & DOM References ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("webcam");
    const startModal = document.getElementById("start-modal");
    const startBtn = document.getElementById("start-btn");
    const statusPill = document.getElementById("status-pill");
    const scoreEl = document.getElementById("score-el");
    const accuracyEl = document.getElementById("accuracy-el");
    const ammoBox = document.getElementById("ammo-cylinder");

    const sound = new SoundFX();
    let handLandmarker = null;
    let runningMode = "VIDEO";
    let lastVideoTime = -1;

    // Game Config
    const MAX_AMMO = 6;
    let ammo = MAX_AMMO;
    let score = 0;
    let shotsFired = 0;
    let shotsHit = 0;

    // Gesture State Machine
    let smoothX = null;
    let smoothY = null;
    const SMOOTHING_ALPHA = 0.65;
    let isArmed = false;
    let lastFireTime = 0;

    // Screen Shake & Screen Flash
    let screenShake = 0;
    let flashAlpha = 0;

    // Game Entities
    const bottles = [];
    const particles = [];
    const BOTTLE_WIDTH = 48;
    const BOTTLE_HEIGHT = 100;
    const SHELF_Y = 520;

    function initAmmoUI() {
      ammoBox.innerHTML = "";
      for (let i = 0; i < MAX_AMMO; i++) {
        const d = document.createElement("div");
        d.className = `bullet-icon ${i < ammo ? "" : "spent"}`;
        ammoBox.appendChild(d);
      }
    }

    function updateHUD() {
      scoreEl.textContent = score;
      const acc = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 100;
      accuracyEl.textContent = `${acc}%`;
      const bullets = ammoBox.children;
      for (let i = 0; i < MAX_AMMO; i++) {
        if (bullets[i]) {
          bullets[i].className = `bullet-icon ${i < ammo ? "" : "spent"}`;
        }
      }
    }

    function spawnBottles() {
      bottles.length = 0;
      const cols = 6;
      const spacing = 160;
      const startX = (canvas.width - (cols - 1) * spacing) / 2;
      const colors = ["#2ecc71", "#e74c3c", "#3498db", "#e67e22", "#9b59b6", "#1abc9c"];

      for (let i = 0; i < cols; i++) {
        bottles.push({
          x: startX + i * spacing - BOTTLE_WIDTH / 2,
          y: SHELF_Y - BOTTLE_HEIGHT,
          width: BOTTLE_WIDTH,
          height: BOTTLE_HEIGHT,
          alive: true,
          color: colors[i % colors.length]
        });
      }
    }

    function createExplosion(x, y, color) {
      const shardCount = 18;
      for (let i = 0; i < shardCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: Math.random() * 6 + 3,
          color: color,
          alpha: 1.0,
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.3
        });
      }
    }

    function fireGun(targetX, targetY) {
      if (ammo <= 0) {
        sound.playEmptyClick();
        statusPill.textContent = "OUT OF AMMO! RELOAD (R)";
        return;
      }

      ammo--;
      shotsFired++;
      lastFireTime = performance.now();
      screenShake = 12;
      flashAlpha = 0.35;
      sound.playShot();

      let hit = false;
      for (const b of bottles) {
        if (b.alive) {
          if (
            targetX >= b.x &&
            targetX <= b.x + b.width &&
            targetY >= b.y &&
            targetY <= b.y + b.height
          ) {
            b.alive = false;
            hit = true;
            shotsHit++;
            score += 100;
            createExplosion(b.x + b.width / 2, b.y + b.height / 2, b.color);
            sound.playShatter();
            break;
          }
        }
      }

      if (!hit) {
        // Stray bullet particle impact
        createExplosion(targetX, targetY, "#ffffff");
      }

      // Respawn if all destroyed
      if (bottles.every((b) => !b.alive)) {
        setTimeout(spawnBottles, 800);
      }

      updateHUD();
    }

    function reload() {
      if (ammo < MAX_AMMO) {
        ammo = MAX_AMMO;
        sound.playReload();
        statusPill.textContent = "CYLINDER RELOADED";
        updateHUD();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") reload();
    });

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // --- MediaPipe Pipeline Initialization ---
    async function initMediaPipe() {
      statusPill.textContent = "LOADING VISION WASM...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
      statusPill.textContent = "READY FOR CALIBRATION";
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 1280, height: 720 },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadeddata = () => resolve(video);
      });
    }

    // --- Main Game Loop ---
    let crosshairPos = null;

    function gameLoop(timestamp) {
      // 1. Process Vision
      if (handLandmarker && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, timestamp);

        if (results.landmarks && results.landmarks.length > 0) {
          const lm = results.landmarks[0];

          // Hand scale: Wrist (0) to Index MCP (5)
          const handScale = Math.max(dist(lm[0], lm[5]), 0.001);

          // Gun Pose Verification
          const indexExtended = dist(lm[8], lm[0]) > dist(lm[6], lm[0]);
          const middleFolded = dist(lm[12], lm[0]) < dist(lm[10], lm[0]) * 1.05;
          const ringFolded = dist(lm[16], lm[0]) < dist(lm[14], lm[0]) * 1.05;
          const pinkyFolded = dist(lm[20], lm[0]) < dist(lm[18], lm[0]) * 1.05;

          const isGun = indexExtended && middleFolded && ringFolded && pinkyFolded;

          if (isGun) {
            // Mirror horizontal coordinate
            const rawX = (1.0 - lm[8].x) * canvas.width;
            const rawY = lm[8].y * canvas.height;

            if (smoothX === null) {
              smoothX = rawX;
              smoothY = rawY;
            } else {
              smoothX = SMOOTHING_ALPHA * rawX + (1 - SMOOTHING_ALPHA) * smoothX;
              smoothY = SMOOTHING_ALPHA * rawY + (1 - SMOOTHING_ALPHA) * smoothY;
            }
            crosshairPos = { x: smoothX, y: smoothY };

            // Trigger Mechanics (Thumb 4 vs Index MCP 5)
            const thumbRatio = dist(lm[4], lm[5]) / handScale;

            if (thumbRatio > 0.65) {
              isArmed = true;
              statusPill.textContent = "HAMMER COCKED (ARMED)";
            } else if (isArmed && thumbRatio < 0.45) {
              isArmed = false;
              statusPill.textContent = "BANG!";
              fireGun(crosshairPos.x, crosshairPos.y);
            } else if (!isArmed) {
              statusPill.textContent = "COCK HAMMER (THUMB UP)";
            }
          } else {
            smoothX = null;
            smoothY = null;
            crosshairPos = null;
            statusPill.textContent = "FORM GUN GESTURE";
          }
        } else {
          // Hand off-screen: auto reload if empty
          if (ammo === 0) reload();
          smoothX = null;
          smoothY = null;
          crosshairPos = null;
          statusPill.textContent = "NO HAND DETECTED";
        }
      }

      // 2. Render Scene
      ctx.save();

      // Screen Shake
      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
      }

      ctx.fillStyle = "#15181f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Range Shelf Stand
      ctx.fillStyle = "#2d241e";
      ctx.fillRect(0, SHELF_Y, canvas.width, 24);
      ctx.fillStyle = "#1b1512";
      ctx.fillRect(0, SHELF_Y + 24, canvas.width, canvas.height - (SHELF_Y + 24));

      // Draw Bottles
      bottles.forEach((b) => {
        if (!b.alive) return;
        ctx.save();
        ctx.fillStyle = b.color;
        // Body
        ctx.fillRect(b.x, b.y + 30, b.width, b.height - 30);
        // Neck
        ctx.fillRect(b.x + b.width / 4, b.y, b.width / 2, 30);
        // Highlights
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillRect(b.x + 4, b.y + 35, 6, b.height - 40);
        ctx.restore();
      });

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35; // gravity
        p.rotation += p.vRot;
        p.alpha -= 0.015;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }

      // Draw Crosshair
      if (crosshairPos) {
        const { x, y } = crosshairPos;
        const firedRecently = performance.now() - lastFireTime < 120;
        const color = firedRecently ? "#ff2a2a" : isArmed ? "#00ffcc" : "#e67e22";

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.stroke();

        // Crosshairs
        ctx.beginPath();
        ctx.moveTo(x - 28, y);
        ctx.lineTo(x - 8, y);
        ctx.moveTo(x + 8, y);
        ctx.lineTo(x + 28, y);
        ctx.moveTo(x, y - 28);
        ctx.lineTo(x, y - 8);
        ctx.moveTo(x, y + 8);
        ctx.lineTo(x, y + 28);
        ctx.stroke();
        ctx.restore();
      }

      // Muzzle Flash
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 245, 220, ${flashAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashAlpha -= 0.04;
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    // --- Initialization Sequence ---
    startBtn.addEventListener("click", async () => {
      sound.init();
      startBtn.textContent = "INITIALIZING HARDWARE...";
      startBtn.disabled = true;

      try {
        await initMediaPipe();
        await startCamera();
        spawnBottles();
        initAmmoUI();
        updateHUD();

        startModal.style.display = "none";
        requestAnimationFrame(gameLoop);
      } catch (err) {
        alert("Failed to initialize camera or vision models: " + err.message);
        startBtn.textContent = "RETRY";
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
